stages:
  - build

dev:
  stage: build
  image: rocq/rocq-prover:dev
  before_script:
    - if [ -n "${COMPILER_EDGE}" ]; then opam switch ${COMPILER_EDGE} && eval $(opam env); fi
    - opam update -y
    - opam config list
    - opam repo list
    - opam list
  script:
    - opam install . --deps-only --with-test -y
    - dune build -j "$NJOBS" @install
    - dune runtest -j "$NJOBS"
    - dune install coq-itauto
  tags:
    - ci.inria.fr
    - medium
