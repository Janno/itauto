stages:
  - build

dev:
  stage: build
  image: rocq/rocq-prover:dev
  before_script:
    - if [ -n "${COMPILER_EDGE}" ]; then opam switch ${COMPILER_EDGE} && eval $(opam env); fi
    - opam update -y
    - opam config list
    - opam repo list
    - opam list
  script:
    - make -j "$NJOBS"
    - make install
  tags:
    - ci.inria.fr
    - medium
